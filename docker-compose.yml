services:
  postgres:
    image: postgres:16-alpine
    container_name: cpay-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cpay
      POSTGRES_PASSWORD: cpay
      POSTGRES_DB: candongueiro_pay
    volumes:
      - cpay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpay -d candongueiro_pay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cpay_pg_data:
